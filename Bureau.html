<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhostOS - Desktop</title>
<link rel="stylesheet" href="Bureau.css">
<style>
  body {
    margin: 0;
    background: linear-gradient(135deg, #6a5ff5 0%, #7c6bf0 22%, #7a8de8 45%, #63b8e4 68%, #4fd6dc 100%);
    color: white;
    font-family: Segoe UI, Arial, sans-serif;
  }
  .viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }
</style>
</head>
<body>

  <!--== BUREAU ==-->
  <div class="viewport">
    <div class="wallpaper" id="wallpaper">
      <svg viewBox="0 0 1408 686" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8f7bf7"/>
            <stop offset="55%" stop-color="#6f9be8"/>
            <stop offset="100%" stop-color="#49d8de"/>
          </linearGradient>
        </defs>
        <path d="M0,0 C250,60 300,260 120,340 C-60,420 -40,620 180,686 L0,686 Z" fill="rgba(255,255,255,0.06)"/>
        <path d="M1408,0 C1150,90 1080,300 1280,380 C1440,440 1408,600 1220,686 L1408,686 Z" fill="rgba(255,255,255,0.05)"/>
        <path d="M420,0 C600,120 520,340 700,420 C900,500 860,686 700,686 L520,686 C420,500 300,300 420,0 Z" fill="rgba(120,90,240,0.18)"/>
        <path d="M0,686 C260,560 420,610 560,686 Z" fill="rgba(20,10,70,0.10)"/>
      </svg>
      <svg class="sparkle" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#ffffff"/>
      </svg>
    </div>

    <!-- Centre de Notifications -->
    <div class="notif-panel">
      <h2>Notifications Center</h2>
      <div class="notif-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Basculer le mode sombre" title="Mode sombre">☾</button>
        <button class="gear-btn" id="gearBtn" aria-label="Paramètres des notifications" title="Paramètres">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="2.3" stroke="currentColor" stroke-width="1.3"/>
            <path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1M12.6 12.6l-1.1-1.1M4.5 4.5l-1.1-1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Icones du bureau -->
    <div class="desktop-icons">
      <button class="desktop-icon" data-app="explorer" data-explorer-path="Documents" aria-label="Ouvrir Documents">
        <span class="glyph">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M6 20c0-3 2-5 5-5h14l6 6h22c3 0 5 2 5 5v24c0 3-2 5-5 5H11c-3 0-5-2-5-5V20z" fill="#5aa7f2"/>
            <path d="M6 24c0-3 2-5 5-5h42c3 0 5 2 5 5v22c0 3-2 5-5 5H11c-3 0-5-2-5-5V24z" fill="#7cc0ff"/>
            <rect x="20" y="19" width="26" height="32" rx="2" fill="#ffffff" stroke="#dfe7f0" stroke-width="1"/>
            <path d="M39 19v7h7z" fill="#eef3f9"/>
            <line x1="24" y1="30" x2="42" y2="30" stroke="#c7d2de" stroke-width="1.6"/>
            <line x1="24" y1="35" x2="42" y2="35" stroke="#c7d2de" stroke-width="1.6"/>
            <line x1="24" y1="40" x2="38" y2="40" stroke="#c7d2de" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="label">Documents</span>
      </button>

      <button class="desktop-icon" data-app="notes" aria-label="Ouvrir Notes">
        <span class="glyph">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="13" y="6" width="38" height="52" rx="4" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.5"/>
            <rect x="13" y="6" width="38" height="10" rx="4" fill="#f4f6f8"/>
            <line x1="19" y1="24" x2="45" y2="24" stroke="#c6ccd4" stroke-width="2"/>
            <line x1="19" y1="31" x2="45" y2="31" stroke="#c6ccd4" stroke-width="2"/>
            <line x1="19" y1="38" x2="45" y2="38" stroke="#c6ccd4" stroke-width="2"/>
            <line x1="19" y1="45" x2="36" y2="45" stroke="#c6ccd4" stroke-width="2"/>
          </svg>
        </span>
        <span class="label">Notes</span>
      </button>

      <button class="desktop-icon" data-app="gallery" aria-label="Ouvrir Galerie">
        <span class="glyph">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
            <g>
              <ellipse cx="32" cy="18" rx="9" ry="13" fill="#ff5b6e" transform="rotate(0 32 32)"/>
              <ellipse cx="32" cy="18" rx="9" ry="13" fill="#ffb23f" transform="rotate(60 32 32)"/>
              <ellipse cx="32" cy="18" rx="9" ry="13" fill="#ffe94a" transform="rotate(120 32 32)"/>
              <ellipse cx="32" cy="18" rx="9" ry="13" fill="#37d67a" transform="rotate(180 32 32)"/>
              <ellipse cx="32" cy="18" rx="9" ry="13" fill="#3fa9f5" transform="rotate(240 32 32)"/>
              <ellipse cx="32" cy="18" rx="9" ry="13" fill="#9b6bff" transform="rotate(300 32 32)"/>
              <circle cx="32" cy="32" r="7" fill="#ffffff"/>
            </g>
          </svg>
        </span>
        <span class="label">Galerie</span>
      </button>

      <button class="desktop-icon" data-app="terminal" aria-label="Ouvrir Terminal">
        <span class="glyph">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="4" y="4" width="56" height="56" rx="13" fill="#1b2420"/>
            <path d="M16 24l10 8-10 8" stroke="#4ee08a" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="31" y1="40" x2="46" y2="40" stroke="#4ee08a" stroke-width="3.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="label">Terminal</span>
      </button>

      <button class="desktop-icon" data-app="calculator" aria-label="Ouvrir Calculator">
        <span class="glyph">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="6" y="3" width="52" height="58" rx="9" fill="#ffc94a"/>
            <rect x="12" y="10" width="40" height="14" rx="2.5" fill="#ffffff" opacity="0.9"/>
            <circle cx="16.5" cy="34" r="4" fill="#ffffff"/><circle cx="32" cy="34" r="4" fill="#ffffff"/><circle cx="47.5" cy="34" r="4" fill="#ffffff"/>
            <circle cx="16.5" cy="47" r="4" fill="#ffffff"/><circle cx="32" cy="47" r="4" fill="#ffffff"/><circle cx="47.5" cy="47" r="4" fill="#ffffff"/>
          </svg>
        </span>
        <span class="label">Calculator</span>
      </button>
    </div>

    <!-- Scrim + fake window (opens on double-click / click of an icon) -->
    <div class="scrim" id="scrim"></div>
    <div class="app-window" id="appWindow">
      <header>
        <span class="dot red" id="winClose2" role="button" tabindex="0" aria-label="Fermer"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="title" id="winTitle">Fenêtre</span>
        <button class="win-close" id="winClose" aria-label="Fermer la fenêtre">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="content" id="winContent"></div>
    </div>

    <!-- Explorateur de fichiers -->
    <div class="explorer-window" id="explorerWindow" aria-label="File Explorer">
      <header class="ew-titlebar" id="ewTitlebar">
        <div class="ew-traffic">
          <button class="ew-dot ew-dot-red" id="ewDotClose" aria-label="Fermer"></button>
          <button class="ew-dot ew-dot-yellow" id="ewDotMin" aria-label="Réduire"></button>
          <button class="ew-dot ew-dot-green" id="ewDotMax" aria-label="Agrandir"></button>
        </div>

        <div class="ew-toolbar">
          <button class="ew-nav-btn" id="ewBack" aria-label="Précédent" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="ew-nav-btn" id="ewFwd" aria-label="Suivant" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="ew-nav-btn" id="ewReload" aria-label="Actualiser">
            <svg width="14" height="14" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3.5H10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div class="ew-breadcrumb" id="ewBreadcrumb">
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8l6-5.5L14 8M4 6.5V13.5h8V6.5" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="ew-crumbs" id="ewCrumbs"></span>
            <button class="ew-crumb-dropdown" id="ewCrumbDropdown" aria-label="Emplacements">
              <svg width="11" height="11" viewBox="0 0 16 16"><path d="M3 6l5 5 5-5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="ew-crumb-menu" id="ewCrumbMenu"></div>
          </div>

          <div class="ew-search">
            <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="10.8" y1="10.8" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input type="text" id="ewSearchInput" placeholder="Search" aria-label="Rechercher dans le dossier">
          </div>
        </div>

        <div class="ew-win-controls">
          <button id="ewMinBtn" aria-label="Réduire">
            <svg width="13" height="13" viewBox="0 0 14 14"><line x1="2" y1="11" x2="12" y2="11" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button id="ewMaxBtn" aria-label="Agrandir">
            <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <button id="ewCloseBtn" class="close" aria-label="Fermer">
            <svg width="13" height="13" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div class="ew-body">
        <aside class="ew-sidebar">
          <div class="ew-sb-section">
            <div class="ew-sb-title">
              <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l2.02 4.1 4.53.66-3.28 3.19.78 4.52L8 11.8l-4.05 2.13.78-4.52L1.45 6.26l4.53-.66L8 1.5z" fill="#ffb23f" stroke="#ffb23f" stroke-width="0.6" stroke-linejoin="round"/></svg>
              Quick Access
            </div>
            <button class="ew-sb-item" data-nav="Desktop">
              <span class="ew-sb-icon" style="color:#5aa7f2;"><svg width="15" height="15" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="9" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="5.5" y1="14" x2="10.5" y2="14" stroke="currentColor" stroke-width="1.3"/><line x1="8" y1="11.5" x2="8" y2="14" stroke="currentColor" stroke-width="1.3"/></svg></span>
              Desktop
            </button>
            <button class="ew-sb-item" data-nav="Documents">
              <span class="ew-sb-icon" style="color:#37b673;"><svg width="15" height="15" viewBox="0 0 16 16"><path d="M1.5 4c0-.8.7-1.5 1.5-1.5h3l1.5 1.5h7c.8 0 1.5.7 1.5 1.5v7c0 .8-.7 1.5-1.5 1.5h-11C2.2 12 1.5 11.3 1.5 10.5V4z" fill="currentColor"/></svg></span>
              Documents
            </button>
            <button class="ew-sb-item" data-nav="Downloads">
              <span class="ew-sb-icon" style="color:#4f7dff;"><svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 1.5v8M4.5 6.5L8 9.5l3.5-3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="2" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
              Downloads
            </button>
            <button class="ew-sb-item" data-nav="Images">
              <span class="ew-sb-icon" style="color:#ff8a3d;"><svg width="15" height="15" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="6" cy="6.3" r="1" fill="currentColor"/><path d="M3 10.5l3-3 2.5 2.5L11 7l2 2" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              Images
            </button>
          </div>

          <div class="ew-sb-section">
            <div class="ew-sb-title">
              <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1" fill="#5aa7f2"/><rect x="4.5" y="12.5" width="7" height="1.4" rx="0.6" fill="#8a8f98"/></svg>
              This PC
            </div>
            <button class="ew-sb-item" data-nav="Documents">Documents</button>
            <button class="ew-sb-item" data-nav="Downloads">Downloads</button>
            <button class="ew-sb-item" data-nav="Music">Music</button>
            <button class="ew-sb-item" data-nav="Videos">Videos</button>
            <button class="ew-sb-item" data-nav="" id="ewLocalDisk">Local Disk C:</button>
          </div>

          <div class="ew-sb-section">
            <button class="ew-sb-item ew-sb-network" id="ewNetwork">
              <span class="ew-sb-icon" style="color:#3fa9f5;"><svg width="15" height="15" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.7 8h12.6M8 1.7c1.8 1.8 1.8 10.8 0 12.6M8 1.7c-1.8 1.8-1.8 10.8 0 12.6" stroke="currentColor" stroke-width="1.1" fill="none"/></svg></span>
              Network
            </button>
          </div>
        </aside>

        <main class="ew-main">
          <div class="ew-grid" id="ewGrid"></div>
          <div class="ew-empty" id="ewEmpty" hidden></div>
        </main>
      </div>

      <div class="ew-resize-handle" id="ewResizeHandle" aria-hidden="true"></div>
    </div>

    <!-- Calculatrice -->
    <div class="app-frame calc-window" id="calcWindow" aria-label="Calculator">
      <header class="af-titlebar" data-drag-handle>
        <div class="af-traffic">
          <button class="af-dot af-dot-red" data-action="close" aria-label="Fermer"></button>
          <button class="af-dot af-dot-yellow" data-action="minimize" aria-label="Réduire"></button>
          <button class="af-dot af-dot-green" data-action="maximize" aria-label="Agrandir"></button>
        </div>
        <div class="af-title">Calculator</div>
        <div class="af-win-controls">
          <button data-action="minimize" aria-label="Réduire"><svg width="13" height="13" viewBox="0 0 14 14"><line x1="2" y1="11" x2="12" y2="11" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <button data-action="maximize" aria-label="Agrandir"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
          <button data-action="close" class="close" aria-label="Fermer"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </div>
      </header>

      <div class="af-body calc-body">
        <div class="calc-main">
          <div class="calc-display">
            <div class="calc-display-tools">
              <button id="calcHistoryToggle" aria-label="Afficher/masquer l'historique" title="Historique">
                <svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 4v4l3 2" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
              </button>
              <button id="calcBackspace" aria-label="Effacer un caractère" title="Effacer">
                <svg width="16" height="15" viewBox="0 0 18 16"><path d="M6 2h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6l-5-6 5-6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 6l4 4M13 6l-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              </button>
              <button id="calcClear" aria-label="Tout effacer" title="Tout effacer">AC</button>
            </div>
            <div class="calc-display-expr" id="calcExpr">&nbsp;</div>
            <div class="calc-display-value" id="calcValue">0</div>
          </div>

          <div class="calc-keys">
            <button class="calc-key" data-key="7">7</button>
            <button class="calc-key" data-key="8">8</button>
            <button class="calc-key" data-key="9">9</button>
            <button class="calc-key calc-op" data-key="+">+</button>
            <button class="calc-key calc-op" data-key="/">÷</button>

            <button class="calc-key" data-key="4">4</button>
            <button class="calc-key" data-key="5">5</button>
            <button class="calc-key" data-key="6">6</button>
            <button class="calc-key calc-op" data-key="-">−</button>
            <button class="calc-key calc-op" data-key="*">×</button>

            <button class="calc-key" data-key="1">1</button>
            <button class="calc-key" data-key="2">2</button>
            <button class="calc-key" data-key="3">3</button>
            <button class="calc-key calc-key-wide" data-key="0">0</button>
            <button class="calc-key" data-key=".">.</button>

            <button class="calc-key calc-equals" id="calcEquals" aria-label="Égal">=</button>
          </div>

          <div class="calc-sci-keys">
            <button class="calc-key calc-sci" data-fn="sin">sin</button>
            <button class="calc-key calc-sci" data-fn="cos">cos</button>
            <button class="calc-key calc-sci" data-fn="tan">tan</button>
            <button class="calc-key calc-sci" data-fn="sq">x²</button>
            <button class="calc-key calc-sci" data-fn="sqrt">√</button>
            <button class="calc-key calc-sci" data-fn="log">log</button>
            <button class="calc-key calc-sci" data-fn="ln">ln</button>
            <button class="calc-key calc-sci" data-const="pi">π</button>
            <button class="calc-key calc-sci" data-const="e">e</button>
            <button class="calc-key calc-sci" data-fn="pct">%</button>
            <button class="calc-key calc-sci" data-fn="inv">1/x</button>
            <button class="calc-key calc-sci" data-key="^">x^y</button>
            <button class="calc-key calc-sci" data-fn="neg">±</button>
            <button class="calc-key calc-sci" data-fn="fact">n!</button>
          </div>
        </div>

        <aside class="calc-history" id="calcHistoryPanel">
          <div class="calc-history-header">
            <h3>History</h3>
            <button id="calcHistoryClose" aria-label="Masquer l'historique">
              <svg width="13" height="13" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="calc-history-list" id="calcHistoryList">
            <p class="calc-history-empty" id="calcHistoryEmpty">Aucun calcul pour le moment.</p>
          </div>
        </aside>
      </div>
    </div>

    <!-- Settings -->
    <div class="app-frame settings-window" id="settingsWindow" aria-label="Settings">
      <header class="af-titlebar" data-drag-handle>
        <div class="af-traffic">
          <button class="af-dot af-dot-red" data-action="close" aria-label="Fermer"></button>
          <button class="af-dot af-dot-yellow" data-action="minimize" aria-label="Réduire"></button>
          <button class="af-dot af-dot-green" data-action="maximize" aria-label="Agrandir"></button>
        </div>
        <div class="af-title" id="settingsTitle">Settings - Appearance</div>
        <div class="af-win-controls">
          <button data-action="minimize" aria-label="Réduire"><svg width="13" height="13" viewBox="0 0 14 14"><line x1="2" y1="11" x2="12" y2="11" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <button data-action="maximize" aria-label="Agrandir"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
          <button data-action="close" class="close" aria-label="Fermer"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </div>
      </header>

      <div class="af-body settings-body">
        <aside class="settings-sidebar">
          <div class="settings-app-title">Settings</div>
          <nav class="settings-nav" id="settingsNav">
            <button class="settings-nav-item active" data-category="appearance">
              <span class="settings-nav-icon" style="background:linear-gradient(135deg,#ff6fa5,#7b5cff);"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="8" cy="8" r="2.6" fill="#fff"/></svg></span>
